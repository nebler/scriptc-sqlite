name: Demo binaries

# Builds the marks demo (demo/) for Linux x64, Linux arm64 and macOS arm64,
# checks each binary against demo/session.expected, and attaches the
# stripped binaries to the run as downloadable artifacts. Manual only;
# nothing is published as a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: marks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install scriptc
        run: npm ci --no-audit --no-fund
      - name: Build marks
        run: cd demo && npm ci --no-audit --no-fund && npm run build
      - name: Check it against the expected session
        run: |
          mkdir -p build
          sh demo/session.sh demo/build/marks build/tmp/marks-session > build/marks-session.out
          diff demo/session.expected build/marks-session.out
      - name: Strip and package
        run: |
          mkdir -p dist
          cp demo/build/marks dist/marks
          strip dist/marks
          ls -l dist/marks
          tar -C dist -czf marks-${{ matrix.name }}.tar.gz marks
      - uses: actions/upload-artifact@v4
        with:
          name: marks-${{ matrix.name }}
          path: marks-${{ matrix.name }}.tar.gz
