name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install scriptc
        run: npm ci --no-audit --no-fund
      # Every program under Node and as scriptc binaries, release and
      # AddressSanitizer, outputs compared byte for byte (see run.sh).
      - name: Check against Node
        run: sh run.sh
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.os }}
          path: |
            build/*.out
            build/*.err
            build/*.build
            build/summary.txt
          if-no-files-found: ignore
